name: Build My Custom VPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Project Files
        shell: python
        run: |
          import os, textwrap

          def write_file(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True) if os.path.dirname(path) else None
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          write_file("settings.gradle.kts", """
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "ShieldVPN"
              include(":app")
          """)

          write_file("build.gradle.kts", """
              plugins {
                  id("com.android.application") version "8.2.0" apply false
                  id("org.jetbrains.kotlin.android") version "1.9.20" apply false
              }
          """)

          write_file("gradle.properties", """
              org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              kotlin.code.style=official
              android.nonTransitiveRClass=true
          """)

          write_file("app/build.gradle.kts", """
              plugins {
                  id("com.android.application")
                  id("org.jetbrains.kotlin.android")
              }
              android {
                  namespace = "com.mycustom.fastvpn"
                  compileSdk = 34
                  defaultConfig {
                      applicationId = "com.mycustom.fastvpn"
                      minSdk = 24
                      targetSdk = 34
                      versionCode = 1
                      versionName = "1.0"
                  }
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                      isCoreLibraryDesugaringEnabled = true
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
              dependencies {
                  coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
                  implementation("com.wireguard.android:tunnel:1.0.20230706")
                  implementation("androidx.core:core-ktx:1.12.0")
                  implementation("androidx.appcompat:appcompat:1.6.1")
                  implementation("com.google.android.material:material:1.11.0")
                  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              }
          """)

          write_file("app/src/main/AndroidManifest.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                  <application
                      android:allowBackup="false"
                      android:label="Shield VPN"
                      android:supportsRtl="true"
                      android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                      <activity android:name=".MainActivity" android:exported="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                      <service
                          android:name="com.wireguard.android.backend.GoBackend$VpnService"
                          android:exported="false"
                          android:permission="android.permission.BIND_VPN_SERVICE">
                          <intent-filter>
                              <action android:name="android.net.VpnService" />
                          </intent-filter>
                      </service>
                  </application>
              </manifest>
          """)

          write_file("app/src/main/res/layout/activity_main.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#0F172A"
                  android:gravity="center"
                  android:orientation="vertical"
                  android:padding="24dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="SHIELD VPN"
                      android:textColor="#38BDF8"
                      android:textSize="28sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="24dp"
                      android:text="Status: Disconnected 🔴"
                      android:textColor="#94A3B8"
                      android:textSize="16sp" />
                  <RadioGroup
                      android:id="@+id/rgCountry"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="#1E293B"
                      android:padding="16dp">
                      <RadioButton
                          android:id="@+id/rbSingapore"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:checked="true"
                          android:padding="12dp"
                          android:text="🇸🇬 Singapore (High Speed)"
                          android:textColor="#F8FAFC" />
                      <RadioButton
                          android:id="@+id/rbThailand"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:padding="12dp"
                          android:text="🇹🇭 Thailand (Low Ping)"
                          android:textColor="#F8FAFC" />
                  </RadioGroup>
                  <EditText
                      android:id="@+id/etCustomConfig"
                      android:layout_width="match_parent"
                      android:layout_height="140dp"
                      android:layout_marginTop="16dp"
                      android:background="#1E293B"
                      android:gravity="top"
                      android:hint="Paste [Interface] and [Peer] WireGuard config here..."
                      android:padding="12dp"
                      android:textColor="#E2E8F0"
                      android:textColorHint="#64748B"
                      android:textSize="12sp" />
                  <Button
                      android:id="@+id/btnConnect"
                      android:layout_width="match_parent"
                      android:layout_height="64dp"
                      android:layout_marginTop="24dp"
                      android:backgroundTint="#0284C7"
                      android:text="CONNECT VPN"
                      android:textColor="#FFFFFF"
                      android:textSize="18sp"
                      android:textStyle="bold" />
              </LinearLayout>
          """)

          write_file("app/src/main/java/com/mycustom/fastvpn/MainActivity.kt", """
              package com.mycustom.fastvpn

              import android.app.Activity
              import android.content.Context
              import android.os.Bundle
              import android.widget.*
              import androidx.activity.result.contract.ActivityResultContracts
              import androidx.appcompat.app.AppCompatActivity
              import androidx.lifecycle.lifecycleScope
              import com.wireguard.android.backend.GoBackend
              import com.wireguard.android.backend.Tunnel
              import com.wireguard.config.Config
              import kotlinx.coroutines.Dispatchers
              import kotlinx.coroutines.launch
              import kotlinx.coroutines.withContext
              import java.io.BufferedReader
              import java.io.StringReader

              class MainActivity : AppCompatActivity() {
                  private lateinit var backend: GoBackend
                  private var isConnected = false
                  private val vpnTunnel = object : Tunnel {
                      override fun getName() = "ShieldTunnel"
                      override fun onStateChange(newState: Tunnel.State) {}
                  }

                  private val vpnLauncher = registerForActivityResult(
                      ActivityResultContracts.StartActivityForResult()
                  ) { res ->
                      if (res.resultCode == Activity.RESULT_OK) toggleVpn()
                  }

                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      setContentView(R.layout.activity_main)
                      backend = GoBackend(applicationContext)

                      val prefs = getSharedPreferences("vpn_prefs", Context.MODE_PRIVATE)
                      val etConfig = findViewById<EditText>(R.id.etCustomConfig)
                      val rgCountry = findViewById<RadioGroup>(R.id.rgCountry)

                      fun loadSavedConfig() {
                          val key = if (rgCountry.checkedRadioButtonId == R.id.rbSingapore) "sg_conf" else "th_conf"
                          etConfig.setText(prefs.getString(key, ""))
                      }

                      loadSavedConfig()
                      rgCountry.setOnCheckedChangeListener { _, _ -> loadSavedConfig() }

                      findViewById<Button>(R.id.btnConnect).setOnClickListener {
                          val key = if (rgCountry.checkedRadioButtonId == R.id.rbSingapore) "sg_conf" else "th_conf"
                          prefs.edit().putString(key, etConfig.text.toString()).apply()

                          val intent = GoBackend.VpnService.prepare(this)
                          if (intent != null) vpnLauncher.launch(intent) else toggleVpn()
                      }
                  }

                  private fun toggleVpn() {
                      val tvStatus = findViewById<TextView>(R.id.tvStatus)
                      val btnConnect = findViewById<Button>(R.id.btnConnect)
                      val etConfig = findViewById<EditText>(R.id.etCustomConfig)
                      val rgCountry = findViewById<RadioGroup>(R.id.rgCountry)
                      val country = if (rgCountry.checkedRadioButtonId == R.id.rbSingapore) "Singapore 🇸🇬" else "Thailand 🇹🇭"

                      lifecycleScope.launch(Dispatchers.IO) {
                          try {
                              if (!isConnected) {
                                  val config = Config.parse(BufferedReader(StringReader(etConfig.text.toString())))
                                  backend.setState(vpnTunnel, Tunnel.State.UP, config)
                                  isConnected = true
                                  withContext(Dispatchers.Main) {
                                      tvStatus.text = "Connected: $country 🟢"
                                      btnConnect.text = "DISCONNECT"
                                      btnConnect.setBackgroundColor(0xFFDC2626.toInt())
                                  }
                              } else {
                                  backend.setState(vpnTunnel, Tunnel.State.DOWN, null)
                                  isConnected = false
                                  withContext(Dispatchers.Main) {
                                      tvStatus.text = "Status: Disconnected 🔴"
                                      btnConnect.text = "CONNECT VPN"
                                      btnConnect.setBackgroundColor(0xFF0284C7.toInt())
                                  }
                              }
                          } catch (e: Exception) {
                              withContext(Dispatchers.Main) {
                                  Toast.makeText(this@MainActivity, "Config မှားနေပါသည်: ${e.message}", Toast.LENGTH_LONG).show()
                              }
                          }
                      }
                  }
              }
          """)

      - name: Compile Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldVPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
